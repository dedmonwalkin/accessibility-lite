# Local-development compose file. The default Postgres password below is
# "alite" — acceptable for localhost, unsafe for any networked deployment.
# For production, provide secrets via an env file (see .env.example) or a
# secret manager.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Real transcription via the whisper.cpp gateway service below.
      - MODEL_PROVIDER=http
      - MODEL_HTTP_BASE_URL=http://model-gateway:4011
      # The gateway lives on the compose-internal network (a private IP);
      # this flag scopes the SSRF exception to MODEL_HTTP_BASE_URL only.
      - MODEL_HTTP_ALLOW_PRIVATE=true
      - MODEL_HTTP_TIMEOUT_MS=120000
      - TRANSLATION_PROVIDER=mock
      - MAX_UPLOAD_MB=500
      - ENABLE_POSTGRES=true
      - DATABASE_URL=postgresql://alite:${POSTGRES_PASSWORD:-alite}@postgres:5432/accessibility_lite
      - SNAPSHOT_INTERVAL_MS=300000
      # Development-only: open endpoints without API keys. Do NOT use in production.
      - AUTH_DISABLED=true
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      model-gateway:
        condition: service_started

  model-gateway:
    build: ./model-gateway
    # No host port mapping: reachable only from the compose network.
    environment:
      - MODEL_GATEWAY_PORT=4011

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alite}
      POSTGRES_DB: accessibility_lite
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alite"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  uploads:
  pgdata:
