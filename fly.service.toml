# Separate consulting site. Never use the media app's fly.toml for this release.
app = "whakauru"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.service"
  ignorefile = "Dockerfile.service.dockerignore"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SITE_URL = "https://workingaccess.org"
  # Transitional verified mailbox; do not replace until new email is tested.
  CONTACT_EMAIL = "bob@whakauru.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  # Paused for rebrand. A future deployment can start machines even with this off.
  auto_start_machines = false
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
