app = "inclusy"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  MODEL_PROVIDER = "mock"
  TRANSLATION_PROVIDER = "mock"
  MAX_UPLOAD_MB = "500"
  ENABLE_POSTGRES = "true"
  SNAPSHOT_INTERVAL_MS = "300000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[mounts]]
  source = "alite_uploads"
  destination = "/app/uploads"
  initial_size = "3gb"
