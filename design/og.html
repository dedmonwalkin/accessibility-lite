<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Atkinson Hyperlegible";
    font-weight: 400;
    src: url("../public/fonts/atkinson-400-latin.woff2") format("woff2");
  }
  @font-face {
    font-family: "Atkinson Hyperlegible";
    font-weight: 700;
    src: url("../public/fonts/atkinson-700-latin.woff2") format("woff2");
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    background: #FBFAF8; color: #14171C;
    font-family: "Atkinson Hyperlegible", sans-serif;
    padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .mark { display: flex; align-items: center; gap: 16px; }
  .mark svg { width: 56px; height: 56px; }
  .mark span { font-size: 34px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 82px; line-height: 1.05; letter-spacing: -0.03em; max-width: 15ch; }
  .sub { font-size: 30px; color: #4A525E; margin-top: 24px; max-width: 34ch; line-height: 1.35; }
  .layers { display: flex; gap: 14px; }
  .layer {
    border: 2px solid #858C96; border-radius: 999px;
    padding: 10px 24px; font-size: 24px; font-weight: 700; color: #14171C;
  }
  .layer.accent { background: #0B4FD9; border-color: #0B4FD9; color: #fff; }
  .rule { height: 2px; background: #E4E2DE; }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 32 32">
      <rect width="32" height="32" rx="7" fill="#0B4FD9"/>
      <circle cx="16" cy="11" r="4.5" fill="none" stroke="#fff" stroke-width="2.4"/>
      <rect x="6" y="19" width="20" height="2.6" rx="1.3" fill="#fff"/>
      <rect x="6" y="24" width="13" height="2.6" rx="1.3" fill="#fff"/>
    </svg>
    <span>Inclusy</span>
  </div>

  <div>
    <h1>Make any media accessible.</h1>
    <p class="sub">Captions, audio descriptions, and sign language overlays from one upload.</p>
  </div>

  <div>
    <div class="rule" style="margin-bottom:28px"></div>
    <div class="layers">
      <span class="layer accent">Captions</span>
      <span class="layer">Audio description</span>
      <span class="layer">Sign language</span>
      <span class="layer">Open source</span>
    </div>
  </div>
</body>
</html>
